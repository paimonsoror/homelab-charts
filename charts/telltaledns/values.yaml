image:
  repository: ghcr.io/paimonsoror/telltale
  # `edge` is rebuilt from main on every push; Always so a restart picks up the latest.
  tag: edge
  pullPolicy: Always

# The DNS service. The pod listens on 5353 (non-root can't bind 53 in Kubernetes);
# the LoadBalancer maps 53 -> 5353.
service:
  dns:
    type: LoadBalancer
    # Keep client source IPs (per-device filtering and the query log need them).
    externalTrafficPolicy: Local
    annotations: {}
  # The REST API (and, later, the web UI). Shares the DNS service's IP when both carry the
  # same io.cilium/lb-ipam-sharing-key.
  api:
    type: LoadBalancer
    port: 8053
    externalTrafficPolicy: Local
    annotations: {}
  metrics:
    port: 9153
  # The TelltaleDNS cluster port (mTLS between nodes). When enabled, the API Service also
  # carries it, so other nodes (the Pi) can reach this node at <api IP>:8443.
  cluster:
    enabled: false
    port: 8443

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s

persistence:
  # Snapshots, downloaded lists, and the query log.
  enabled: true
  size: 5Gi
  storageClass: ""
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    # Steady state is ~35 MiB with the default lists; compiling them peaks near 110 MiB.
    memory: 512Mi

# telltale.toml. Listeners, data_dir, and the metrics address are set by the chart.
config: |
  [node]
  workers = 2

# A ConfigMap with the TelltaleDNS dashboard for the Grafana sidecar (label grafana_dashboard=1).
grafanaDashboard:
  enabled: false

# The UI and API behind an ingress (TLS). Set [api] trusted_proxies in config to the
# ingress's source network so sign-in lockouts and the audit log see real client addresses.
ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tlsSecretName: ""

# An existing Secret holding OIDC client secrets, mounted read-only at /etc/telltale-oidc
# (point client_secret_file at /etc/telltale-oidc/<key>). Optional: the pod starts without it
# and TelltaleDNS logs that OIDC is off.
oidcSecret:
  name: ""

# Resolver pods (TelltaleDNS T6.14): stateless DNS pods that join this pod's cluster with a
# shared join secret, serve its configuration and lists, and ship their query log to it. This
# pod stays the primary with the volume; the DNS Service spreads queries over it and them.
# The join secret is a credential: create it outside Git, e.g.
#   kubectl -n telltaledns create secret generic telltaledns-cluster-join \
#     --from-literal=secret="$(head -c 32 /dev/urandom | base64)"
resolvers:
  enabled: false
  replicas: 2
  # This pod's cluster address as it advertises it (`telltale cluster status`).
  joinUrl: ""
  # The site the pods report (the primary's own site, from `telltale cluster status`).
  site: k8s
  joinSecret:
    name: telltaledns-cluster-join
    key: secret
  # A resolver pod not heard from for this long leaves the cluster's member list.
  ephemeralTtlSeconds: 600
  resources:
    requests:
      cpu: 50m
      memory: 48Mi
    limits:
      memory: 256Mi
  # e.g. spread over Kubernetes nodes: podAntiAffinity on app.kubernetes.io/component: resolver
  affinity: {}
