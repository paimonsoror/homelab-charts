image:
  repository: ghcr.io/paimonsoror/telltale
  # `edge` is rebuilt from main on every push; Always so a restart picks up the latest.
  tag: edge
  pullPolicy: Always

# The DNS service. The pod listens on 5353 (non-root can't bind 53 in Kubernetes);
# the LoadBalancer maps 53 -> 5353.
service:
  dns:
    type: LoadBalancer
    # Keep client source IPs (per-device filtering and the query log need them).
    externalTrafficPolicy: Local
    annotations: {}
  # The REST API (and, later, the web UI). Shares the DNS service's IP when both carry the
  # same io.cilium/lb-ipam-sharing-key.
  api:
    type: LoadBalancer
    port: 8053
    externalTrafficPolicy: Local
    annotations: {}
  metrics:
    port: 9153

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s

persistence:
  # Snapshots, downloaded lists, and the query log.
  enabled: true
  size: 5Gi
  storageClass: ""
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    # Steady state is ~35 MiB with the default lists; compiling them peaks near 110 MiB.
    memory: 512Mi

# telltale.toml. Listeners, data_dir, and the metrics address are set by the chart.
config: |
  [node]
  workers = 2

# A ConfigMap with the TelltaleDNS dashboard for the Grafana sidecar (label grafana_dashboard=1).
grafanaDashboard:
  enabled: false

# The UI and API behind an ingress (TLS). Set [api] trusted_proxies in config to the
# ingress's source network so sign-in lockouts and the audit log see real client addresses.
ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tlsSecretName: ""

# An existing Secret holding OIDC client secrets, mounted read-only at /etc/telltale-oidc
# (point client_secret_file at /etc/telltale-oidc/<key>). Optional: the pod starts without it
# and TelltaleDNS logs that OIDC is off.
oidcSecret:
  name: ""
