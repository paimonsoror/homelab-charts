apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "telltaledns.fullname" . }}
  labels:
    {{- include "telltaledns.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One writer for the ReadWriteOnce data volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "telltaledns.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "telltaledns.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telltaledns
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - run
            - -c
            - /etc/telltale/00-chart.toml
            - -c
            - /etc/telltale/10-values.toml
          ports:
            - name: dns-udp
              containerPort: 5353
              protocol: UDP
            - name: dns-tcp
              containerPort: 5353
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metrics.port }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/telltale
              readOnly: true
            - name: data
              mountPath: /var/lib/telltale
      volumes:
        - name: config
          configMap:
            name: {{ include "telltaledns.fullname" . }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "telltaledns.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
