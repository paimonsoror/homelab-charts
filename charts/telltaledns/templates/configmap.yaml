apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "telltaledns.fullname" . }}
  labels:
    {{- include "telltaledns.labels" . | nindent 4 }}
data:
  # Fixed by the chart (ports and paths the templates rely on).
  00-chart.toml: |
    config_version = 1

    [node]
    data_dir = "/var/lib/telltale"

    [[listen]]
    proto = "udp"
    addr = "0.0.0.0:5353"

    [[listen]]
    proto = "tcp"
    addr = "0.0.0.0:5353"

    [telemetry.metrics]
    listen = "0.0.0.0:{{ .Values.service.metrics.port }}"

    [api]
    listen = "0.0.0.0:{{ .Values.service.api.port }}"
  # From values.config (later files override earlier ones).
  10-values.toml: |
    {{- .Values.config | nindent 4 }}
  {{- if .Values.resolvers.enabled }}
  # The primary accepts resolver pods that know the join secret.
  20-primary.toml: |
    [cluster]
    bootstrap_secret_file = "/etc/telltale-cluster/{{ .Values.resolvers.joinSecret.key }}"
    ephemeral_ttl_secs = {{ .Values.resolvers.ephemeralTtlSeconds }}
  # Resolver pods: join on start, never eligible, query log shipped to the primary.
  20-resolver.toml: |
    [cluster]
    eligible = false
    ephemeral = true
    bootstrap_secret_file = "/etc/telltale-cluster/{{ .Values.resolvers.joinSecret.key }}"
    join_url = {{ required "resolvers.joinUrl is required" .Values.resolvers.joinUrl | quote }}

    [telemetry]
    mode = "ship"
  {{- end }}
