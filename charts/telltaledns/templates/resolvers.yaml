{{- if .Values.resolvers.enabled }}
# Resolver pods (TelltaleDNS T6.14, CLU-009): each joins the primary on start with the join
# secret (a fresh identity per pod), serves the cluster's configuration and lists, ships its
# query log to the primary, and turns ready only once synced, so it never answers unfiltered.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "telltaledns.fullname" . }}-resolver
  labels:
    {{- include "telltaledns.labels" . | nindent 4 }}
    app.kubernetes.io/component: resolver
spec:
  replicas: {{ .Values.resolvers.replicas }}
  selector:
    matchLabels:
      {{- include "telltaledns.resolverSelectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        {{- include "telltaledns.resolverSelectorLabels" . | nindent 8 }}
        telltaledns.sororlab.dev/serves-dns: "true"
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telltaledns
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run", "-c", "/etc/telltale/00-chart.toml", "-c", "/etc/telltale/10-values.toml", "-c", "/etc/telltale/20-resolver.toml"]
          env:
            - name: TELLTALE_KUBE_NODE
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
            - name: TELLTALE_POD
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            # Keep answering 5 s after turning not ready, while the Service drops the pod.
            - name: TELLTALE_DRAIN_DELAY_SECS
              value: "5"
          ports:
            - name: dns-udp
              containerPort: 5353
              protocol: UDP
            - name: dns-tcp
              containerPort: 5353
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metrics.port }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Ready once joined and synced; joining retries for two minutes, then the pod exits
          # and Kubernetes restarts it.
          startupProbe:
            httpGet: { path: /readyz, port: metrics }
            periodSeconds: 2
            failureThreshold: 150
          readinessProbe:
            httpGet: { path: /readyz, port: metrics }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: metrics }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resolvers.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/telltale
              readOnly: true
            - name: data
              mountPath: /var/lib/telltale
            - name: cluster-join
              mountPath: /etc/telltale-cluster
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "telltaledns.fullname" . }}
        # A fresh identity per pod: it joins as a new ephemeral member each start.
        - name: data
          emptyDir: {}
        - name: cluster-join
          secret:
            secretName: {{ .Values.resolvers.joinSecret.name }}
      {{- with .Values.resolvers.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
