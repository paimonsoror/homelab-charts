apiVersion: v1
kind: Service
metadata:
  name: {{ include "telltaledns.fullname" . }}-dns
  labels:
    {{- include "telltaledns.labels" . | nindent 4 }}
  {{- with .Values.service.dns.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.dns.type }}
  {{- if eq .Values.service.dns.type "LoadBalancer" }}
  externalTrafficPolicy: {{ .Values.service.dns.externalTrafficPolicy }}
  {{- end }}
  {{- if .Values.resolvers.enabled }}
  # Every pod that answers DNS. With resolver pods this one Service also carries the API and
  # cluster ports: they're named ports only the primary has, so only it gets that traffic, and
  # nothing else needs the IP (Cilium shares an externalTrafficPolicy Local IP only between
  # Services selecting the same pods). The API Service is then ClusterIP, for the ingress.
  selector:
    {{- include "telltaledns.dnsSelectorLabels" . | nindent 4 }}
  {{- else }}
  selector:
    {{- include "telltaledns.selectorLabels" . | nindent 4 }}
  {{- end }}
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    {{- if .Values.resolvers.enabled }}
    - name: api
      port: {{ .Values.service.api.port }}
      targetPort: api
      protocol: TCP
    {{- if .Values.service.cluster.enabled }}
    - name: cluster
      port: {{ .Values.service.cluster.port }}
      targetPort: cluster
      protocol: TCP
    {{- end }}
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "telltaledns.fullname" . }}-metrics
  labels:
    {{- include "telltaledns.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "telltaledns.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.service.metrics.port }}
      targetPort: metrics
      protocol: TCP
