    - name: loki
      enabled: true
      spec:
        project: default
        source:
          repoURL: https://grafana.github.io/helm-charts
          targetRevision: 0.80.6
          helm:
            values: |-
              loki:
                structuredConfig:
                  limits_config:
                    enforce_metric_name: false
                    reject_old_samples: true
                    reject_old_samples_max_age: 168h
                    max_cache_freshness_per_query: 10m
                    split_queries_by_interval: 15m
                    ingestion_rate_mb: 4
                    ingestion_burst_size_mb: 6
                    max_streams_per_user: 10000
                    retention_period: 720h
                    volume_enabled: true
                schemaConfig:
                  configs:
                    - from: 2024-01-01
                      store: boltdb-shipper
                      object_store: filesystem
                      schema: v11
                      index:
                        prefix: index_
                        period: 24h

                storage:
                  type: filesystem
                  filesystem:
                    directory: /var/loki/chunks

                compactor:  
                  working_directory: /var/loki
                  sharedStore: filesystem
                  retention_enabled: true
                  retention_delete_delay: 2h
                  retention_delete_worker_count: 150
                  compaction_interval: 10m
              compactor:
                enabled: true
                persistence:
                  enabled: true
                  size: 5Gi
                  storageClass: local-path
              querier:
                persistence:
                  enabled: true
                  size: 5Gi
                  storageClass: local-path
              serviceMonitor:
                enabled: true
                labels:
                  release: prometheus
              ingester:
                replicas: 1
                persistence:
                  enabled: true
                  size: 10Gi
                  storageClass: local-path
              gateway:
                enabled: true
                ingress:
                  enabled: true
                  ingressClassName: cilium
                  annotations:
                    ingress.cilium.io/loadbalancer-mode: shared
                    cert-manager.io/cluster-issuer: letsencrypt-prod
                  hosts:
                    - host: loki.gateway.sororlab.dev
                      paths:
                        - path: /
                          pathType: Prefix
                  tls:
                    - secretName: loki-gateway-tls
                      hosts:
                        - loki.gateway.sororlab.dev
          chart: loki-distributed
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: loki
        syncPolicy:
          automated: {}
          syncOptions:
            - CreateNamespace=true
    - name: prometheus
      enabled: true
      spec:
        project: default
        source:
          repoURL: 'https://prometheus-community.github.io/helm-charts'
          targetRevision: 91.0.0
          helm:
            values: |-
              prometheus:
                enabled: true
                prometheusSpec:
                  serviceMonitorSelectorNilUsesHelmValues: false
                  additionalScrapeConfigs:
                    - job_name: "netdata-exporter"
                      metrics_path: '/api/v1/allmetrics'
                      params:
                        # format: prometheus | prometheus_all_hosts
                        # You can use `prometheus_all_hosts` if you want Prometheus to set the `instance` to your hostname instead of IP 
                        format: [ prometheus ]
                        #
                        # sources: as-collected | raw | average | sum | volume
                        # default is: average
                        #source: [as-collected]
                        #
                        # server name for this prometheus - the default is the client IP
                        # for Netdata to uniquely identify it
                        #server: ['prometheus1']
                      honor_labels: true

                      static_configs:
                        - targets: [ 'truenas.sororlab.dev:20489' ]
              grafana:
                enabled: true
                admin:
                  existingSecret: prometheus-grafana-admin
                ingress:
                  enabled: true
                  ingressClassName: cilium
                  annotations:
                    ingress.cilium.io/loadbalancer-mode: shared
                    cert-manager.io/cluster-issuer: letsencrypt-prod
                  hosts:
                    - grafana.sororlab.dev
                  tls:
                    - secretName: grafana-tls
                      hosts:
                        - grafana.sororlab.dev
                persistence:
                  enabled: true
                  type: sts
                  storageClassName: local-path
                  accessModes:
                    - ReadWriteOnce
                  size: 20Gi
                  finalizers:
                    - kubernetes.io/pvc-protection
          chart: kube-prometheus-stack
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: prometheus
        syncPolicy:
          syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
