# library chart values are purely for documentation purposes

argoconfig:
  application:
    ####################################
    ### Start of LLM Related Charts ###
    ####################################
    - name: chromadb
      enabled: false
      spec:
        project: default
        source:
          repoURL: 'https://amikos-tech.github.io/chromadb-chart/'
          targetRevision: 0.2.2
          helm:
            values: |-
              ingress:
                enabled: true
                className: "cilium"
                annotations:
                  ingress.cilium.io/loadbalancer-mode: shared
                  cert-manager.io/cluster-issuer: letsencrypt-prod
                hosts:
                  - host: chromadb.sororlab.dev
                    paths:
                      - path: /
                        pathType: Prefix
                tls:
                  - secretName: chromadb-tls
                    hosts:
                      - chromadb.sororlab.dev

          chart: chromadb
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: chromadb
        syncPolicy:
          automated: {}
          syncOptions:
            - CreateNamespace=true
    - name: flowise
      enabled: false
      spec:
        project: default 
        source:
          repoURL: 'https://cowboysysop.github.io/charts/'
          targetRevision: 6.0.0
          helm:
            values: |-
              ingress:
                enabled: true
                ingressClassName: "cilium"
                pathType: Prefix
                annotations:
                  ingress.cilium.io/loadbalancer-mode: shared
                  cert-manager.io/cluster-issuer: letsencrypt-prod
                hosts:
                  - host: flowise.sororlab.dev
                    paths:
                      - /
                tls:
                  - secretName: flowise-tls
                    hosts:
                      - flowise.sororlab.dev
          chart: flowise
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: flowise
        syncPolicy:
          automated: {}
          syncOptions:
            - CreateNamespace=true
    - name: ollama
      enabled: false
      spec:
        project: default
        source:
          repoURL: 'https://helm.otwld.com/'
          targetRevision: 1.56.0
          helm:
            values: |-
              ollama:
                models:
                  pull:
                    - llama2
                    - mistral
              ingress:
                enabled: true
                className: "cilium"
                annotations:
                  ingress.cilium.io/loadbalancer-mode: shared
                  cert-manager.io/cluster-issuer: letsencrypt-prod
                  nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
                  nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
                  nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
                  cilium.io/proxy-timeout-seconds: "600"
                hosts:
                    - host: ollama.sororlab.dev
                      paths:
                        - path: /
                          pathType: Prefix
                tls:
                  - secretName: ollama-tls
                    hosts:
                      - ollama.sororlab.dev                     
          chart: ollama
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: ollama
        syncPolicy:
          automated: {}
          syncOptions:
            - CreateNamespace=true

    ####################################
    ### Start of Photo Storage
    ####################################
    - name: cloudnative-pg-operator
      enabled: true
      spec:
        project: default
        source:
          repoURL: https://cloudnative-pg.github.io/charts
          targetRevision: 0.29.0
          chart: cloudnative-pg
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: cnpg-system
        syncPolicy:
          automated: {}
          syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
    - name: backstage-infra
      enabled: true
      spec:
        project: default
        source:
          repoURL: https://github.com/paimonsoror/homelab-charts
          path: manifests/backstage-infra
          targetRevision: HEAD
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: backstage
        syncPolicy:
          automated: {}
          syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
    - name: backstage
      enabled: true
      spec:
        project: default
        source:
          repoURL: https://backstage.github.io/charts
          targetRevision: 2.10.1
          chart: backstage
          helm:
            values: |-
              backstage:
                image:
                  registry: ghcr.io
                  repository: paimonsoror/backstage
                  tag: latest
                args:
                  - "--config"
                  - "app-config.yaml"
                  - "--config"
                  - "app-config.production.yaml"
                extraEnvVars:
                  - name: POSTGRES_HOST
                    value: backstage-postgres-rw
                  - name: POSTGRES_PORT
                    value: "5432"
                  - name: POSTGRES_USER
                    valueFrom:
                      secretKeyRef:
                        name: backstage-postgres-user
                        key: username
                  - name: POSTGRES_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: backstage-postgres-user
                        key: password
                  - name: AUTH_SESSION_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: backstage-session
                        key: session-secret
                  - name: AUTH_OIDC_CLIENT_ID
                    valueFrom:
                      secretKeyRef:
                        name: backstage-sso
                        key: client_id
                  - name: AUTH_OIDC_CLIENT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: backstage-sso
                        key: client_secret
                  - name: AUTH_OIDC_METADATA_URL
                    value: https://auth.sororlab.dev/application/o/backstage/.well-known/openid-configuration
                  - name: K8S_SERVICE_ACCOUNT_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: backstage-k8s-token
                        key: token
                  - name: ARGOCD_AUTH_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: backstage-argocd-token
                        key: token
                  # Scaffolder pull requests + GitHub catalog reads. Optional so the
                  # pod still starts before the token Secret exists.
                  - name: GITHUB_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: backstage-github-token
                        key: token
                        optional: true
              serviceAccount:
                create: false
                name: backstage
              ingress:
                enabled: true
                className: cilium
                annotations:
                  ingress.cilium.io/loadbalancer-mode: shared
                  cert-manager.io/cluster-issuer: letsencrypt-prod
                host: backstage.sororlab.dev
                tls:
                  enabled: true
                  secretName: backstage-tls
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: backstage
        syncPolicy:
          automated: {}
          syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
    - name: cert-manager
      enabled: true
      spec:
        project: default
        source:
          repoURL: https://charts.jetstack.io
          targetRevision: v1.21.2
          chart: cert-manager
          helm:
            values: |-
              installCRDs: true
              extraArgs:
                - --feature-gates=ExperimentalGatewayAPISupport=true
                - --dns01-recursive-nameservers-only
                - --dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: cert-manager
        syncPolicy:
          automated: {}
          syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
    - name: immich
      enabled: true
      spec:
        project: default
        source:
          repoURL: https://immich-app.github.io/immich-charts
          targetRevision: 0.12.0
          helm:
            values: |-
              controllers:
                main:
                  containers:
                    main:
                      image:
                        tag: v3.2.2
                      env:
                        DB_HOSTNAME:
                          valueFrom:
                            secretKeyRef:
                              name: immich-postgres-user
                              key: host
                        DB_USERNAME:
                          valueFrom:
                            secretKeyRef:
                              name: immich-postgres-user
                              key: username
                        DB_DATABASE_NAME:
                          valueFrom:
                            secretKeyRef:
                              name: immich-postgres-user
                              key: dbname
                        DB_PASSWORD:
                          valueFrom:
                            secretKeyRef:
                              name: immich-postgres-user
                              key: password
              immich:
                metrics:
                  enabled: true
                persistence:
                  library:
                    existingClaim: immich-pvc
                existingConfiguration: immich-oauth-config
                configurationKind: Secret
              valkey:
                enabled: true
              server:
                enabled: true
                controllers:
                  main:
                    containers:
                      main:
                        image:
                          repository: ghcr.io/immich-app/immich-server
                          pullPolicy: IfNotPresent
                ingress:
                  main:
                    enabled: true
                    className: "cilium"
                    annotations:
                      ingress.cilium.io/loadbalancer-mode: shared
                      cert-manager.io/cluster-issuer: letsencrypt-prod
                    hosts:
                      - host: immich.sororlab.dev
                        paths:
                          - path: "/"
                            service:
                              identifier: main
                    tls:
                      - secretName: immich-tls
                        hosts:
                          - immich.sororlab.dev
              machine-learning:
                enabled: true
          chart: immich
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: immich
        syncPolicy:
          automated: {}
          syncOptions:
            - CreateNamespace=true
    - name: immich-power-tools
      enabled: true
      spec:
        project: default
        source:
          repoURL: https://gitlab.alexware.systems/api/v4/projects/645/packages/helm/stable
          targetRevision: 0.1.0
          chart: immich-power-tools
          helm:
            values: |-
              config:
                immichUrl: http://immich-server.immich.svc.cluster.local:2283
                externalImmichUrl: https://immich.sororlab.dev
                database:
                  host: immich-postgres-rw.immich.svc.cluster.local
                  port: 5432
                  databaseName: immich
              secrets:
                immichSecretName: immich-power-tools-api
                immichSecretApiKeyKey: IMMICH_API_KEY
                databaseSecretName: immich-postgres-user
                databaseSecretUsernameKey: username
                databaseSecretPasswordKey: password
              ingress:
                enabled: true
                className: cilium
                annotations:
                  ingress.cilium.io/loadbalancer-mode: shared
                  cert-manager.io/cluster-issuer: letsencrypt-prod
                hosts:
                  - host: immich-pt.sororlab.dev
                    paths:
                      - path: /
                        pathType: Prefix
                tls:
                  - secretName: immich-pt-tls
                    hosts:
                      - immich-pt.sororlab.dev
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: immich
        syncPolicy:
          automated: {}
          syncOptions:
            - CreateNamespace=true

    ####################################
    ### Start of Homelab Productivity ###
    ####################################
    - name: code-server
      enabled: true
      spec:
        project: default
        source:
          repoURL: https://github.com/coder/code-server
          path: ci/helm-chart
          targetRevision: v4.137.0
          helm:
            values: |-
              existingSecret: code-password
              ingress:
                enabled: true
                ingressClassName: cilium
                annotations:
                  ingress.cilium.io/loadbalancer-mode: shared
                  cert-manager.io/cluster-issuer: letsencrypt-prod
                hosts:
                  - host: code.sororlab.dev
                    paths:
                      - /
                tls: 
                  - secretName: code-tls
                    hosts:
                      - code.sororlab.dev
              extraVolumeMounts:
                - name: extra-volume
                  mountPath: /mnt/homelab-charts
                  readOnly: false
                  hostPath: /home/homelab/GitHub/homelab-charts
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: code
        syncPolicy:
          automated: {}
          syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true 
    - name: nextcloud
      enabled: false
      spec:
        project: default
        source:
          repoURL: https://nextcloud.github.io/helm/
          targetRevision: 6.5.2
          helm:
            values: |-
            
          chart: nextcloud
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: nextcloud
        syncPolicy:
          automated: {}
          syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
    - name: portainer
      enabled: true
      spec:
        project: default
        source:
          repoURL: https://portainer.github.io/k8s/
          targetRevision: 245.0.0
          helm:
            values: |-
              enterpriseEdition: 
                enabled: true
                image:
                  repository: portainer/portainer-ee
                  tag: 2.45.0
                  pullPolicy: Always
              ingress:
                enabled: true
                ingressClassName: cilium
                annotations:
                  ingress.cilium.io/loadbalancer-mode: shared
                  cert-manager.io/cluster-issuer: letsencrypt-prod
                hosts:
                  - host: portainer.sororlab.dev
                    paths:
                      - path: "/"
                tls: 
                  - secretName: portainer-tls
                    hosts:
                      - portainer.sororlab.dev

          chart: portainer
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: portainer
        syncPolicy:
          automated: {}
          syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
    - name: technitium
      enabled: enable 
      spec:
        project: default
        source: 
          repoURL: https://github.com/paimonsoror/technitium-dns
          path: .
          targetRevision: HEAD
          helm:
            values: |-
              image:
                tag: 15.4.0
              dnsServer:
                domain: "technitium2"
                webServiceEnableHttp: true
                webServiceEnableHttps: true
              persistence:
                enabled: true
                accessMode: ReadWriteOnce
                size: 1Gi
                existingClaim: "technitium-pvc"
              customCA:
                enabled: true
                secret:
                  name: my-ca-cert
                  key: ca.crt
              pfxCertificate:
                enabled: true
                mountPath: "/certs"
                secret:
                  name: technitium-pfx-cert
                  pfxKey: certificate.pfx
              service:
                web:
                  annotations:             
                    io.cilium/lb-ipam-ips: 192.168.5.112
                    io.cilium/lb-ipam-sharing-key: technitium
                  type: LoadBalancer
                webTls:
                  annotations:             
                    io.cilium/lb-ipam-ips: 192.168.5.112
                    io.cilium/lb-ipam-sharing-key: technitium
                  type: LoadBalancer
                dns:
                  annotations:             
                    io.cilium/lb-ipam-ips: 192.168.5.112
                    io.cilium/lb-ipam-sharing-key: technitium
                  type: LoadBalancer
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: technitium
        syncPolicy:
          automated: {}
          syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true 
    - name: technitium-exporter
      enabled: true
      spec:
        project: default
        source:
          repoURL: https://github.com/paimonsoror/homelab-charts
          path: charts/technitium-exporter
          targetRevision: HEAD
          helm:
            values: |-
              technitium:
                baseUrl: "https://192.168.5.112:53443"
                verifySsl: false
                statsRange: LastHour
                nodes: "technitium1.dnscluster,technitium2.dnscluster"
              existingSecret:
                name: technitium-exporter-token
                key: token
              serviceMonitor:
                enabled: true
        destination:
          server: "https://kubernetes.default.svc"
          namespace: technitium
        syncPolicy:
          automated: {}
          syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
    - name: pihole
      enabled: true 
      spec:
        project: default
        source: 
          repoURL: https://mojo2600.github.io/pihole-kubernetes
          targetRevision: 2.35.0
          chart: pihole
          helm:
            values: |-
              image:
                repository: "pihole/pihole"
                tag: "2025.10.0"
              extraEnvVars:
                PIHOLE_UID: 3005
                PIHOLE_GID: 3003
              admin:
                enabled: true
                existingSecret: pihole-password
                passwordKey: "password"
              virtualHost: pihole.sororlab.dev
              DNS1: "1.1.1.1"
              DNS2: "1.0.0.1"
              serviceDns:
                annotations:             
                  io.cilium/lb-ipam-ips: 192.168.5.102
                  io.cilium/lb-ipam-sharing-key: pi-hole
                type: LoadBalancer
              serviceDhcp:
                annotations:             
                  io.cilium/lb-ipam-ips: 192.168.5.102
                  io.cilium/lb-ipam-sharing-key: pi-hole
                type: LoadBalancer
              serviceWeb:
                annotations:             
                  io.cilium/lb-ipam-ips: 192.168.5.102
                  io.cilium/lb-ipam-sharing-key: pi-hole
                http:
                  enabled: true
                https:
                  enabled: true
                type: LoadBalancer
              ingress:
                enabled: false
                ingressClassName: cilium
                annotations:
                  ingress.cilium.io/loadbalancer-mode: dedicated
                  cert-manager.io/cluster-issuer: letsencrypt-prod
                hosts:
                  - pihole.sororlab.dev
                path: /
                pathType: Prefix
                tls: 
                  - secretName: pihole-tls
                    hosts:
                      - pihole.sororlab.dev
              dnsmasq:
                additionalDnsEntries:
                  - address=/pihole.sororlab.dev/192.168.5.102
                  - address=/pihole.pi/192.168.3.2
                additionalHostsEntries:
                  - 127.0.0.1 pihole.sororlab.dev
              persistentVolumeClaim:
                enabled: true
                existingClaim: pihole-pvc
              extraVolumes:
                custom-dnsmasq-dir:
                  persistentVolumeClaim:
                    claimName: pihole-dnsmasq-pvc
              extraVolumeMounts:
                custom-dnsmasq-dir:
                  mountPath: /etc/dnsmasq.d   
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: pihole
        syncPolicy:
          automated: {}
          syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true 
    - name: hivemq-mqtt-platform
      enabled: false
      spec:
        project: default
        source:
          repoURL: https://hivemq.github.io/helm-charts
          targetRevision: 0.2.21
          helm:
            values: |-
              replicaCount: 1
          chart: hivemq-platform
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: hivemq
        syncPolicy:
          automated: {}
          syncOptions:
            - CreateNamespace=true
    - name: hivemq-mqtt-operator
      enabled: false
      spec:
        project: default
        source:
          repoURL: https://hivemq.github.io/helm-charts
          targetRevision: 0.2.9
          helm:
            values: |-
              replicaCount: 1
                
          chart: hivemq-platform-operator
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: hivemq
        syncPolicy:
          automated: {}
          syncOptions:
            - CreateNamespace=true
    - name: homeassistant
      enabled: true
      spec:
        project: default
        source:
          repoURL: 'https://pajikos.github.io/home-assistant-helm-chart'
          targetRevision: 0.3.80
          helm:
            values: |-
              ingress:
                # Enable ingress for home assistant
                enabled: true
                className: "cilium"
                annotations:
                  ingress.cilium.io/loadbalancer-mode: shared
                  cert-manager.io/cluster-issuer: letsencrypt-prod
                hosts:
                    - host: homeassistant.sororlab.dev
                      paths:
                        - path: /
                          pathType: Prefix
                tls:
                  - secretName: homeassistant-tls
                    hosts:
                      - homeassistant.sororlab.dev

              configuration:
                enabled: true
                forceInit: false
                trusted_proxies:
                  - 10.0.0.0/8
                  - 192.0.0.0/8

              persistence:
                enabled: true
                size: "10Gi"
                existingVolume: homeassistant-pv-volume

          chart: home-assistant
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: homeassistant
        syncPolicy:
          automated: {}
          syncOptions:
            - CreateNamespace=true
    - name: vaultwarden
      enabled: true
      spec:
        project: default
        source:
          #repoURL: 'https://github.com/paimonsoror/vaultwarden.git'
          repoURL: 'https://github.com/guerzon/vaultwarden.git'
          targetRevision: main
          path: charts/vaultwarden
          helm:
            values: |-
              image:
                registry: docker.io
                repository: vaultwarden/server
                tag: "1.37.2"                # pin instead of "latest"
              adminToken:
                existingSecret: vaultwarden-admin-token
                existingSecretKey: ADMIN_TOKEN
              podSecurityContext:            # NEW block
                runAsUser: 1000
                runAsGroup: 3008             # ← matches TrueNAS group GID
                fsGroup: 3008                # supplementary group for the volume
                runAsNonRoot: true
              domain: "https://vaultwarden.sororlab.dev"
              storage:
                existingVolumeClaim: 
                  claimName: vaultwarden-pvc
              ingress:
                enabled: true
                class: cilium
                additionalAnnotations:
                  ingress.cilium.io/loadbalancer-mode: shared
                  cert-manager.io/cluster-issuer: letsencrypt-prod
                hostname: vaultwarden.sororlab.dev
                tlsSecret: vaultwarden-tls
              sso:
                enabled: true
                onlySSO: false
                signupsMatchEmail: true
                authority: https://auth.sororlab.dev/application/o/vaultwarden/
                pkce: true
                scopes: "email profile offline_access"
                existingSecret: vaultwarden-sso
                clientId:
                  existingSecretKey: client_id
                clientSecret:
                  existingSecretKey: client_secret
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: vaultwarden
        syncPolicy:
          syncOptions:
            - CreateNamespace=true
    
    - name: authentik
      enabled: true
      spec:
        project: default
        source:
          repoURL: https://charts.goauthentik.io
          targetRevision: 2026.8.2
          chart: authentik
          helm:
            values: |-
              global:
                envFrom:
                  - secretRef:
                      name: authentik-bootstrap
              authentik:
                error_reporting:
                  enabled: false
                postgresql:
                  host: authentik-postgresql
                  name: authentik
                  user: authentik
                redis:
                  host: authentik-redis-master
              server:
                env:
                  - name: AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS
                    value: "192.168.5.2/32,10.0.0.0/24"
                ingress:
                  enabled: true
                  ingressClassName: cilium
                  annotations:
                    ingress.cilium.io/loadbalancer-mode: shared
                    cert-manager.io/cluster-issuer: letsencrypt-prod
                  hosts:
                    - auth.sororlab.dev
                  paths:
                    - /
                  pathType: Prefix
                  tls:
                    - secretName: auth-tls
                      hosts:
                        - auth.sororlab.dev
                metrics:
                  enabled: true
                  serviceMonitor:
                    enabled: true
              worker:
                metrics:
                  enabled: true
                  serviceMonitor:
                    enabled: true
              postgresql:
                enabled: true
                auth:
                  username: authentik
                  database: authentik
                  existingSecret: authentik-bootstrap
                  secretKeys:
                    adminPasswordKey: postgres-password
                    userPasswordKey: password
                primary:
                  persistence:
                    enabled: true
                    size: 8Gi
                    storageClass: local-path
              redis:
                enabled: true
                auth:
                  enabled: false
                master:
                  persistence:
                    enabled: true
                    size: 2Gi
                    storageClass: local-path
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: authentik
        syncPolicy:
          automated: {}
          syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true

    - name: vault
      enabled: true
      spec:
        project: default
        source:
          repoURL: https://helm.releases.hashicorp.com
          targetRevision: 0.34.1
          chart: vault
          helm:
            # Canonical copy: github.com/paimonsoror/courier deploy/phase0/vault-values.yaml
            values: |-
              # Vault Community Edition for the Courier proof of value.
              # Chart: hashicorp/vault 0.34.1 (Vault 2.0.4) from https://helm.releases.hashicorp.com
              #
              # This file is canonical; the ArgoCD Application in homelab-charts inlines a copy.
              #
              # Prerequisite, created out of band (never in git):
              #   Secret vault/vault-awskms with AWS_REGION, VAULT_AWSKMS_SEAL_KEY_ID,
              #   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY for KMS auto-unseal.

              global:
                enabled: true
                tlsDisable: true          # TLS terminates at the Cilium ingress

              injector:
                enabled: false            # workloads will use External Secrets in Phase 2

              server:
                image:
                  repository: hashicorp/vault
                  tag: "2.0.4"
                logFormat: json

                extraSecretEnvironmentVars:
                  - envName: AWS_REGION
                    secretName: vault-awskms
                    secretKey: AWS_REGION
                  - envName: VAULT_AWSKMS_SEAL_KEY_ID
                    secretName: vault-awskms
                    secretKey: VAULT_AWSKMS_SEAL_KEY_ID
                  - envName: AWS_ACCESS_KEY_ID
                    secretName: vault-awskms
                    secretKey: AWS_ACCESS_KEY_ID
                  - envName: AWS_SECRET_ACCESS_KEY
                    secretName: vault-awskms
                    secretKey: AWS_SECRET_ACCESS_KEY

                # Local disk, not NFS: avoids the hard-mount hang on node restarts.
                dataStorage:
                  enabled: true
                  size: 5Gi
                  storageClass: local-path
                auditStorage:
                  enabled: true
                  size: 5Gi
                  storageClass: local-path

                ingress:
                  enabled: true
                  ingressClassName: cilium
                  annotations:
                    ingress.cilium.io/loadbalancer-mode: shared
                    cert-manager.io/cluster-issuer: letsencrypt-prod
                  pathType: Prefix
                  activeService: true
                  hosts:
                    - host: vault.sororlab.dev
                      paths: []
                  tls:
                    - secretName: vault-tls
                      hosts:
                        - vault.sororlab.dev

                standalone:
                  enabled: false

                # Integrated storage (raft) with one replica, so more nodes can join late
                # without a storage migration.
                ha:
                  enabled: true
                  replicas: 1
                  disruptionBudget:
                    enabled: false        # a 1-replica PDB would block node drains
                  raft:
                    enabled: true
                    setNodeId: true
                    config: |
                      ui = true
                      disable_mlock = true

                      listener "tcp" {
                        tls_disable     = 1
                        address         = "[::]:8200"
                        cluster_address = "[::]:8201"
                        telemetry {
                          unauthenticated_metrics_access = true
                        }
                      }

                      storage "raft" {
                        path = "/vault/data"
                      }

                      # Region and key id come from AWS_REGION / VAULT_AWSKMS_SEAL_KEY_ID.
                      seal "awskms" {}

                      service_registration "kubernetes" {}

                      telemetry {
                        prometheus_retention_time = "30s"
                        disable_hostname          = true
                      }

              ui:
                enabled: true
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: vault
        syncPolicy:
          automated: {}
          syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true

