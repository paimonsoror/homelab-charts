---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-sync-watcher
  namespace: argocd
---
# Deliberately a Role, not a ClusterRole: the watcher only ever touches
# Application objects and its own state ConfigMap, both in the argocd
# namespace. It does not need to read anything it syncs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-sync-watcher
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["argocd-sync-watcher-state"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]   # resourceNames cannot gate create; the name is fixed in the script
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-sync-watcher
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-sync-watcher
subjects:
  - kind: ServiceAccount
    name: argocd-sync-watcher
    namespace: argocd
